openapi: 3.0.3
info:
  title: Laravel
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
paths:
  /api/user:
    get:
      summary: ''
      operationId: getApiUser
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      security: []
  /api/product:
    get:
      summary: 'Display all products.'
      operationId: displayAllProducts
      description: ''
      parameters:
        -
          in: query
          name: page
          description: 'The page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'The page number.'
            example: 1
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  data:
                    -
                      id: 1
                      name: 'Product 1'
                      price: '1000.00'
                      created_at: '2024-06-21 19:42:39'
                      updated_at: '2024-06-21 19:42:39'
                  meta:
                    current_page: 1
                    first_page_url: 'http://localhost:8000/api/products?page=1'
                    next_page_url: null
                    prev_page_url: null
                    path: 'http://localhost:8000/api/products'
                    per_page: 15
                    from: 1
                    to: 1
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        name: 'Product 1'
                        price: '1000.00'
                        created_at: '2024-06-21 19:42:39'
                        updated_at: '2024-06-21 19:42:39'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: 'Product 1'
                        price:
                          type: string
                          example: '1000.00'
                        created_at:
                          type: string
                          example: '2024-06-21 19:42:39'
                        updated_at:
                          type: string
                          example: '2024-06-21 19:42:39'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      first_page_url:
                        type: string
                        example: 'http://localhost:8000/api/products?page=1'
                      next_page_url:
                        type: string
                        example: null
                      prev_page_url:
                        type: string
                        example: null
                      path:
                        type: string
                        example: 'http://localhost:8000/api/products'
                      per_page:
                        type: integer
                        example: 15
                      from:
                        type: integer
                        example: 1
                      to:
                        type: integer
                        example: 1
      tags:
        - 'Product management'
      security: []
    post:
      summary: 'Store a new product.'
      operationId: storeANewProduct
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  data:
                    id: 1
                    name: 'new product'
                    price: '13000.00'
                    created_at: '2024-06-21 19:42:39'
                    updated_at: '2024-06-21 19:42:39'
                  message: 'product created successfully.'
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'new product'
                      price:
                        type: string
                        example: '13000.00'
                      created_at:
                        type: string
                        example: '2024-06-21 19:42:39'
                      updated_at:
                        type: string
                        example: '2024-06-21 19:42:39'
                  message:
                    type: string
                    example: 'product created successfully.'
      tags:
        - 'Product management'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The name of the product.'
                  example: 'new product'
                price:
                  type: number
                  description: 'The price of the product.'
                  example: 13000.0
              required:
                - name
                - price
      security: []
  '/api/product/{id}':
    get:
      summary: 'Display a specified product.'
      operationId: displayASpecifiedProduct
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  data:
                    id: 1
                    name: 'Product 1'
                    price: '1000.00'
                    created_at: '2024-06-21 19:42:39'
                    updated_at: '2024-06-21 19:42:39'
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'Product 1'
                      price:
                        type: string
                        example: '1000.00'
                      created_at:
                        type: string
                        example: '2024-06-21 19:42:39'
                      updated_at:
                        type: string
                        example: '2024-06-21 19:42:39'
      tags:
        - 'Product management'
      security: []
    put:
      summary: 'Update a product.'
      operationId: updateAProduct
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  data:
                    id: 1
                    name: 'updated product'
                    price: '15000.00'
                    created_at: '2024-06-21 19:42:39'
                    updated_at: '2024-06-21T11:30:00.000000Z'
                  message: 'product updated successfully.'
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: 'updated product'
                      price:
                        type: string
                        example: '15000.00'
                      created_at:
                        type: string
                        example: '2024-06-21 19:42:39'
                      updated_at:
                        type: string
                        example: '2024-06-21T11:30:00.000000Z'
                  message:
                    type: string
                    example: 'product updated successfully.'
      tags:
        - 'Product management'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'The name of the product.'
                  example: 'updated product'
                price:
                  type: number
                  description: 'The price of the product.'
                  example: 15000.0
              required:
                - name
                - price
      security: []
    delete:
      summary: 'delete a product.'
      operationId: deleteAProduct
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: true
                  message: 'product deleted successfully.'
                properties:
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'product deleted successfully.'
      tags:
        - 'Product management'
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the product.'
        example: 1
        required: true
        schema:
          type: integer
tags:
  -
    name: Endpoints
    description: ''
  -
    name: 'Product management'
    description: "\nAPIs for managing products"
